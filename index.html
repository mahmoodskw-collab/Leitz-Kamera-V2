<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<title>LEITZ Kamera</title>
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Courier+Prime:wght@400;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

:root{
  --red:#CC0000;
  --cream:#F0EBE0;
  --black:#0D0D0D;
  --mid:#242424;
  --silver:#888;
  --border:#333;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

html,body{
  width:100%;height:100%;background:var(--black);
  overflow:hidden;touch-action:none;
  user-select:none;-webkit-user-select:none;
  position:fixed;inset:0;
  font-family:'Courier Prime',monospace;color:var(--cream);
}

.screen{display:none;flex-direction:column;height:100%;}
.screen.active{display:flex;}

/* ── VIEWFINDER — 4:5 portrait crop ── */
#vfWrap{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:#000;
  overflow:hidden;
  position:relative;
}

#viewfinder{
  position:relative;
  overflow:hidden;
  background:#000;
  width:100%;
  /* 4:5 aspect ratio */
  aspect-ratio:4/5;
  /* cap height so bottom controls are always visible */
  max-height:calc(100dvh - 185px);
  flex-shrink:0;
  align-self:center;
}

#video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;transform:translateZ(0);will-change:transform;
}

/* Live filter canvas — sits on top of video, pointer-events:none */
#liveCanvas{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;pointer-events:none;z-index:3;
  display:none; /* shown only when filter active */
  transform:translateZ(0);will-change:transform;
}

/* Offscreen capture canvas */
#captureCanvas{display:none;}

/* Brackets */
.bracket{position:absolute;width:22px;height:22px;border-color:rgba(255,255,255,.5);border-style:solid;pointer-events:none;z-index:6;}
.bracket.tl{top:18px;left:18px;border-width:1.5px 0 0 1.5px;}
.bracket.tr{top:18px;right:18px;border-width:1.5px 1.5px 0 0;}
.bracket.bl{bottom:18px;left:18px;border-width:0 0 1.5px 1.5px;}
.bracket.br{bottom:18px;right:18px;border-width:0 1.5px 1.5px 0;}

/* AF + EV cluster */
#afCluster{
  position:absolute;
  transform:translate(-50%,-50%);
  z-index:8;display:none;
  /* cluster is pointer-events:auto so the slider is touchable */
}

#afBox{
  width:64px;height:64px;
  border:1.5px solid rgba(255,255,255,.9);
  pointer-events:none;
  transition:border-color .25s;
}
#afBox.focused{border-color:var(--red);}
@keyframes afSnap{0%{transform:scale(1.4);opacity:.5;}100%{transform:scale(1);opacity:1;}}
#afBox.snap{animation:afSnap .22s ease-out forwards;}

/* EV slider — appears to the right of the AF box */
#evSliderWrap{
  position:absolute;
  left:calc(100% + 12px);
  top:50%;transform:translateY(-50%);
  display:none;
  flex-direction:column;
  align-items:center;
  gap:4px;
  opacity:0;
  transition:opacity .3s;
}
#evSliderWrap.show{display:flex;opacity:1;}

#evSliderWrap .ev-sun{font-size:16px;line-height:1;}
#evSliderWrap .ev-sun.top{margin-bottom:2px;}
#evSliderWrap .ev-sun.bot{margin-top:2px;}

#evSlider{
  -webkit-appearance:slider-vertical;
  writing-mode:vertical-lr;
  direction:rtl;
  width:28px;
  height:120px;
  cursor:pointer;
  accent-color:var(--red);
  background:transparent;
}
/* Fallback for browsers that don't support slider-vertical */
@supports not (-webkit-appearance:slider-vertical){
  #evSlider{
    writing-mode:unset;
    -webkit-appearance:none;
    appearance:none;
    width:120px;height:28px;
    transform:rotate(-90deg);
  }
}

#evReadout{
  font-size:10px;font-weight:700;
  color:var(--red);letter-spacing:.05em;
  text-align:center;min-width:32px;
  background:rgba(0,0,0,.6);
  padding:2px 4px;border-radius:2px;
}

/* Top HUD */
.top-hud{
  position:absolute;top:0;left:0;right:0;
  padding:calc(var(--safe-top) + 12px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:10;
  background:linear-gradient(to bottom,rgba(0,0,0,.75) 0%,transparent 100%);
}
.leica-dot{width:10px;height:10px;background:var(--red);border-radius:50%;}
.hud-brand{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:300;letter-spacing:.35em;}
.hud-brand span{color:var(--red);font-weight:500;}
.mode-badge{font-size:9px;letter-spacing:.2em;color:var(--silver);border:1px solid var(--border);padding:3px 8px;text-transform:uppercase;}

/* Exposure strip */
.exp-strip{
  position:absolute;top:calc(var(--safe-top) + 52px);
  left:0;right:0;display:flex;justify-content:center;gap:24px;
  z-index:10;padding:4px 0;
}
.exp-val{display:flex;flex-direction:column;align-items:center;gap:1px;}
.exp-val .lbl{font-size:8px;letter-spacing:.18em;color:rgba(255,255,255,.38);text-transform:uppercase;}
.exp-val .val{font-size:14px;color:rgba(255,255,255,.9);letter-spacing:.05em;}
.exp-val .val.m{color:var(--red);}

/* Mode pills */
.mode-pills{
  position:absolute;top:calc(var(--safe-top) + 96px);right:14px;
  display:flex;flex-direction:column;gap:7px;z-index:10;
}
.pill{
  background:rgba(0,0,0,.65);border:1px solid var(--border);
  color:var(--silver);font-family:'Courier Prime',monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:7px 10px;cursor:pointer;transition:all .2s;text-align:center;
}
.pill.active{border-color:var(--red);color:var(--red);background:rgba(0,0,0,.8);}

/* Manual dials — static flow, between viewfinder and bottom controls */
#manualPanel{
  background:#111;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:8px 14px;
  display:none;
  flex-shrink:0;
}
#manualPanel.show{display:block;}
.dials{display:flex;gap:10px;}
.dial{
  flex:1;background:rgba(0,0,0,.82);border:1px solid var(--border);
  border-radius:2px;padding:10px 6px 8px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.dial-lbl{font-size:8px;letter-spacing:.22em;color:var(--silver);text-transform:uppercase;}
.dial-val{font-size:17px;font-weight:700;color:var(--red);letter-spacing:.04em;text-align:center;min-height:24px;line-height:1.4;}
.dial-arrows{display:flex;width:100%;}
.darr{
  flex:1;background:none;border:none;color:rgba(255,255,255,.55);
  font-size:22px;cursor:pointer;padding:6px 0;text-align:center;
  min-height:44px;display:flex;align-items:center;justify-content:center;
  transition:color .15s;
}
.darr:active{color:var(--red);}

/* Bottom controls — static flow below viewfinder */
.bottom-ctrl{
  background:#0D0D0D;
  padding:10px 16px calc(var(--safe-bottom) + 12px);
  flex-shrink:0;
}

/* Filter tabs */
.ftabs{display:flex;gap:18px;margin-bottom:9px;}
.ftab{
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--silver);background:none;border:none;cursor:pointer;
  padding-bottom:4px;border-bottom:1px solid transparent;transition:all .2s;
}
.ftab.active{color:var(--cream);border-bottom-color:var(--red);}

/* ── FILTER STRIP — the scrollable fix ── */
.fstrip-wrap{
  /* explicit width so children don't collapse */
  width:100%;
  overflow-x:scroll;     /* always scrollable */
  -webkit-overflow-scrolling:touch;
  overflow-y:hidden;
  scrollbar-width:none;
  touch-action:pan-x;    /* let horizontal swipe pass through */
  margin-bottom:10px;
  padding-bottom:4px;    /* room for scrollbar on some devices */
}
.fstrip-wrap::-webkit-scrollbar{display:none;}

.fstrip{
  display:inline-flex;   /* shrink-wraps to content width */
  gap:9px;
  padding:2px 2px 2px 2px;
  /* no flex-wrap, no overflow here — parent handles scroll */
}

.fchip{
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;
}
.fthumb{
  width:52px;height:52px;border:1.5px solid transparent;
  border-radius:2px;overflow:hidden;background:#1a1a1a;
  position:relative;transition:border-color .2s;
}
.fchip.active .fthumb{border-color:var(--red);}
.fthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.fname{
  font-size:7px;letter-spacing:.08em;color:rgba(255,255,255,.65);
  text-transform:uppercase;text-align:center;max-width:52px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* Shutter row */
.shutter-row{display:flex;align-items:center;justify-content:space-between;}
.side-btn{
  width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  color:var(--cream);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;transition:all .2s;
}
.side-btn:active{background:rgba(255,255,255,.18);transform:scale(.94);}
.side-btn .si{font-size:20px;line-height:1;}
.side-btn .sl{font-size:7px;letter-spacing:.13em;color:var(--silver);text-transform:uppercase;}

.shutter{
  width:76px;height:76px;border-radius:50%;background:var(--cream);
  border:none;cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 0 8px rgba(255,255,255,.05);
  transition:transform .1s;
}
.shutter::before{content:'';width:58px;height:58px;border-radius:50%;background:#e4ddd0;position:absolute;}
.shutter::after{content:'';width:40px;height:40px;border-radius:50%;background:var(--cream);position:absolute;}
.shutter:active{transform:scale(.92);}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(204,0,0,.8),0 0 0 4px rgba(255,255,255,.12);}100%{box-shadow:0 0 0 22px rgba(204,0,0,0),0 0 0 4px rgba(255,255,255,.12);}}
.shutter.fire{animation:ring .4s ease-out;}

/* AI toggle switch */
.ai-toggle{position:relative;display:inline-block;width:38px;height:20px;}
.ai-toggle input{opacity:0;width:0;height:0;}
.ai-slider{
  position:absolute;inset:0;background:var(--border);cursor:pointer;
  border-radius:20px;transition:.25s;
}
.ai-slider::before{
  content:'';position:absolute;width:14px;height:14px;
  left:3px;top:3px;background:var(--silver);
  border-radius:50%;transition:.25s;
}
.ai-toggle input:checked + .ai-slider{background:var(--red);}
.ai-toggle input:checked + .ai-slider::before{transform:translateX(18px);background:#fff;}

@keyframes spin{to{transform:rotate(360deg);}}
.grid-ov.show{display:block;}
.grid-ov svg{width:100%;height:100%;opacity:.22;}

/* Flash */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:100;transition:opacity .06s;}
#flash.pop{opacity:1;}

/* Toast */
#toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.88);border:1px solid var(--border);
  color:var(--cream);font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  padding:10px 20px;z-index:300;opacity:0;pointer-events:none;
  transition:opacity .3s;text-align:center;
}
#toast.show{opacity:1;}

/* Zoom badge */
#zoomBadge{
  position:absolute;bottom:calc(var(--safe-bottom)+182px);left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.8);
  background:rgba(0,0,0,.55);padding:3px 12px;border-radius:20px;z-index:10;
  opacity:0;transition:opacity .5s;
}
#zoomBadge.show{opacity:1;transition:opacity 0s;}

/* ── GALLERY ── */
#galleryScreen{background:var(--black);overflow:hidden;}
.gal-header{
  padding:calc(var(--safe-top)+14px) 18px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);background:#111;
}
.gal-title{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:300;letter-spacing:.3em;}
.gal-back{background:none;border:none;color:var(--cream);font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;}
.gal-count{font-size:9px;color:var(--silver);letter-spacing:.2em;}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;overflow-y:auto;flex:1;padding-bottom:calc(var(--safe-bottom)+8px);}
.gal-grid::-webkit-scrollbar{display:none;}
.gal-item{aspect-ratio:1;overflow:hidden;cursor:pointer;position:relative;background:var(--mid);}
.gal-item img{width:100%;height:100%;object-fit:cover;display:block;}
.gal-item .fbadge{position:absolute;bottom:3px;left:3px;font-size:7px;letter-spacing:.08em;background:rgba(0,0,0,.7);color:rgba(255,255,255,.8);padding:2px 4px;text-transform:uppercase;}
.gal-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--silver);}
.gal-empty svg{opacity:.2;}
.gal-empty p{font-size:11px;letter-spacing:.2em;text-transform:uppercase;}

/* ── VIEWER ── */
#viewer{
  display:none;position:fixed;inset:0;
  background:#000;z-index:200;
  flex-direction:column;
  overflow:hidden;
  touch-action:pan-x; /* allow horizontal swipe */
}
#viewer.open{display:flex;}

/* Slide track — holds all photos side by side */
#viewerTrack{
  display:flex;
  flex:1;
  transition:transform .3s cubic-bezier(.25,.46,.45,.94);
  will-change:transform;
}

.v-slide{
  flex-shrink:0;
  width:100vw;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.v-slide img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  pointer-events:none;
  display:block;
}

/* Counter pill */
#viewerCounter{
  position:absolute;top:calc(var(--safe-top)+14px);left:50%;
  transform:translateX(-50%);
  font-size:10px;letter-spacing:.15em;
  color:rgba(255,255,255,.7);
  background:rgba(0,0,0,.55);
  padding:3px 12px;border-radius:20px;
  z-index:10;pointer-events:none;
}

/* Top bar */
.viewer-top{
  position:absolute;top:0;left:0;right:0;
  padding:calc(var(--safe-top)+12px) 16px 10px;
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(to bottom,rgba(0,0,0,.75) 0%,transparent 100%);
  z-index:10;
}
.v-close{
  background:none;border:none;color:var(--cream);
  font-family:'Courier Prime',monospace;
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;
  padding:6px 0;
}

/* Bottom bar */
.viewer-bar{
  position:absolute;bottom:0;left:0;right:0;
  padding:14px 18px calc(var(--safe-bottom)+16px);
  display:flex;justify-content:space-between;align-items:flex-end;
  background:linear-gradient(to top,rgba(0,0,0,.88) 0%,transparent 100%);
  z-index:10;
}
.v-meta{
  font-size:9px;letter-spacing:.12em;color:var(--silver);
  line-height:1.7;flex:1;
}
.viewer-actions{
  display:flex;gap:10px;align-items:center;
}
.v-save{
  background:var(--red);border:none;color:#fff;
  font-family:'Courier Prime',monospace;
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  padding:9px 16px;cursor:pointer;
}
.v-delete{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  color:var(--cream);
  font-family:'Courier Prime',monospace;
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  padding:9px 14px;cursor:pointer;
  transition:background .2s,border-color .2s;
}
.v-delete:active{background:rgba(204,0,0,.3);border-color:var(--red);}

/* Swipe nav arrows (desktop hint, hidden on small) */
.v-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(0,0,0,.4);border:none;
  color:rgba(255,255,255,.6);font-size:28px;
  padding:12px 10px;cursor:pointer;z-index:10;
  display:none; /* shown only on wide screens */
}
.v-arrow.left{left:0;}
.v-arrow.right{right:0;}
@media(min-width:600px){.v-arrow{display:block;}}
</style>
</head>
<body>

<div id="flash"></div>
<div id="toast"></div>
<canvas id="captureCanvas"></canvas>

<!-- ══ CAMERA ══ -->
<div class="screen active" id="cameraScreen">

  <!-- 4:5 viewfinder wrapper -->
  <div id="vfWrap">
    <div id="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="liveCanvas"></canvas>

      <div class="top-hud">
        <div class="leica-dot"></div>
        <div class="hud-brand">LEITZ <span>M</span></div>
        <div class="mode-badge" id="modeBadge">AUTO</div>
      </div>

      <div class="exp-strip">
        <div class="exp-val"><span class="lbl">f</span><span class="val" id="fDisp">2.0</span></div>
        <div class="exp-val"><span class="lbl">S</span><span class="val" id="sDisp">1/125</span></div>
        <div class="exp-val"><span class="lbl">ISO</span><span class="val" id="iDisp">400</span></div>
      </div>

      <div class="mode-pills">
        <button class="pill active" id="pillA" onclick="setMode('auto')">A</button>
        <button class="pill"        id="pillM" onclick="setMode('manual')">M</button>
        <button class="pill"        id="pillG" onclick="toggleGrid()">⊞</button>
      </div>

      <!-- AF + EV cluster -->
      <div id="afCluster">
        <div id="afBox"></div>
        <div id="evSliderWrap">
          <span class="ev-sun top">☀</span>
          <input type="range" id="evSlider" min="-3" max="3" step="0.1" value="0"
                 oninput="onEvSlider(this.value)"
                 ontouchstart="event.stopPropagation()"
                 ontouchmove="event.stopPropagation()">
          <span class="ev-sun bot">☾</span>
          <div id="evReadout">0.0</div>
        </div>
      </div>

      <div class="grid-ov" id="gridOv">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="white" stroke-width="0.3"/>
          <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="white" stroke-width="0.3"/>
          <line x1="0" y1="33.3" x2="100" y2="33.3" stroke="white" stroke-width="0.3"/>
          <line x1="0" y1="66.6" x2="100" y2="66.6" stroke="white" stroke-width="0.3"/>
        </svg>
      </div>

      <div class="bracket tl"></div><div class="bracket tr"></div>
      <div class="bracket bl"></div><div class="bracket br"></div>
      <div id="zoomBadge">1×</div>
    </div><!-- end #viewfinder -->
  </div><!-- end #vfWrap -->

  <!-- Manual dials — outside viewfinder so always visible -->
  <div id="manualPanel">
    <div class="dials">
      <div class="dial">
        <div class="dial-lbl">Aperture</div>
        <div class="dial-val" id="fDial">f/2.0</div>
        <div class="dial-arrows">
          <button class="darr" ontouchstart="startDial('f',-1)" onmousedown="startDial('f',-1)">‹</button>
          <button class="darr" ontouchstart="startDial('f',1)"  onmousedown="startDial('f',1)">›</button>
        </div>
      </div>
      <div class="dial">
        <div class="dial-lbl">Shutter</div>
        <div class="dial-val" id="sDial">1/125</div>
        <div class="dial-arrows">
          <button class="darr" ontouchstart="startDial('s',-1)" onmousedown="startDial('s',-1)">‹</button>
          <button class="darr" ontouchstart="startDial('s',1)"  onmousedown="startDial('s',1)">›</button>
        </div>
      </div>
      <div class="dial">
        <div class="dial-lbl">ISO</div>
        <div class="dial-val" id="iDial">400</div>
        <div class="dial-arrows">
          <button class="darr" ontouchstart="startDial('iso',-1)" onmousedown="startDial('iso',-1)">‹</button>
          <button class="darr" ontouchstart="startDial('iso',1)"  onmousedown="startDial('iso',1)">›</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom controls — outside viewfinder -->
  <div class="bottom-ctrl">
    <div class="ftabs">
      <button class="ftab active" onclick="switchTab('color')">Color</button>
      <button class="ftab"        onclick="switchTab('mono')">Mono</button>
      <button class="ftab"        onclick="switchTab('off')">Off</button>
    </div>
    <div class="fstrip-wrap" id="fstripWrap">
      <div class="fstrip" id="fstrip"></div>
    </div>
    <!-- AI enhance toggle -->
    <div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:8px;gap:8px;">
      <span style="font-size:9px;letter-spacing:.18em;color:var(--silver);text-transform:uppercase;">AI Enhance</span>
      <label class="ai-toggle">
        <input type="checkbox" id="aiToggle" checked>

// ════════════════════════════════════════
let db = null;
const DB_NAME='LeitzDB', DB_VER=1, STORE='photos';

function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)){
        const s=d.createObjectStore(STORE,{keyPath:'id'});
        s.createIndex('ts','ts',{unique:false});
      }
    };
    req.onsuccess=e=>{ db=e.target.result; res(db); };
    req.onerror=e=>rej(e.target.error);
  });
}

function dbSave(photo){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(photo);
    tx.oncomplete=res;
    tx.onerror=e=>rej(e.target.error);
  });
}

function dbLoadAll(){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly');
    const req=tx.objectStore(STORE).getAll();
    req.onsuccess=e=>res(e.target.result.sort((a,b)=>b.id-a.id));
    req.onerror=e=>rej(e.target.error);
  });
}

function dbGetOne(id){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly');
    const req=tx.objectStore(STORE).get(id);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=e=>rej(e.target.error);
  });
}

function dbDelete(id){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete=res;
    tx.onerror=e=>rej(e.target.error);
  });
}

function updateDialDisplays(){
  document.getElementById('fDial').textContent  = 'f/'+F_STOPS[fIdx];

let dialInterval = null;
function startDial(type, dir){
  stepDial(type,dir);
  clearInterval(dialInterval);
  dialInterval = setInterval(()=>stepDial(type,dir), 200);
  const stop = ()=>{ clearInterval(dialInterval); dialInterval=null; };
  document.addEventListener('touchend', stop, {once:true});
  document.addEventListener('mouseup',  stop, {once:true});
}
function stepDial(type,dir){
  if(type==='f')   fIdx   = Math.max(0,Math.min(F_STOPS.length-1,  fIdx+dir));
  if(type==='s')   sIdx   = Math.max(0,Math.min(SHUTTERS.length-1, sIdx+dir));
  if(type==='iso') isoIdx = Math.max(0,Math.min(ISO_VALS.length-1, isoIdx+dir));
  updateDialDisplays();
}

// ════════════════════════════════════════
// FILTER ENGINE
// ════════════════════════════════════════
function clamp(v){ return v<0?0:v>255?255:v; }

function applyFilter(ctx, W, H, p, skipGrain){
  if(!p) return;
  const img = ctx.getImageData(0,0,W,H);
  const d   = img.data;

  const expF = Math.pow(2,(p.ex||0)/50);
  const coF  = 1+(p.co||0)/100;
  const hiF  = (p.hi||0)/200;
  const shF  = (p.sh||0)/200;
  const tmpS = (p.tmp||0)/100*28;
  const tiS  = (p.ti||0)/100*12;
  const satF = 1+(p.sat||0)/100;
  const vibF = (p.vib||0)/200;
  const redB = (p.red||0)/100*38;
  const grnM = (p.grn||0)/100*28;
  const lftA = (p.lift||0)/100*20;

  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2];

    r*=expF; g*=expF; b*=expF;

    const lum=0.299*r+0.587*g+0.114*b;
    const hi=lum/255, sh=1-hi;
    r+=hiF*hi*r+shF*sh*(255-r);
    g+=hiF*hi*g+shF*sh*(255-g);
    b+=hiF*hi*b+shF*sh*(255-b);

    r=(r-128)*coF+128; g=(g-128)*coF+128; b=(b-128)*coF+128;
    r+=tmpS; b-=tmpS; g+=tiS;

    if(r>g&&r>b) r+=redB*(r-Math.max(g,b))/255;
    const exG=Math.max(0,g-Math.max(r,b)); g-=grnM*exG/255;

    const lum2=0.299*r+0.587*g+0.114*b;
    if(lum2<80){const f2=(80-lum2)/80;r+=lftA*f2;g+=lftA*f2*.92;b+=lftA*f2*1.08;}

    const avg=(r+g+b)/3;
    r=avg+(r-avg)*satF; g=avg+(g-avg)*satF; b=avg+(b-avg)*satF;

    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    const sat2=mx?(mx-mn)/mx:0;
    const vB=1+vibF*(1-sat2);
    const avg2=(r+g+b)/3;
    r=avg2+(r-avg2)*vB; g=avg2+(g-avg2)*vB; b=avg2+(b-avg2)*vB;

    if(p.mono){
      const grey=0.213*r+0.715*g+0.072*b;
      const tone=p.tone||0;
      r=grey+tone*.5; g=grey; b=grey-tone*.5;
    }

    // Per-channel tint boosts (for Blue Dream, Cobalt, Verdant, Scarlet)
    if(p.chBlu){ b=clamp(b + p.chBlu * (1 - b/255) * 1.2); }
    if(p.chGrn){ g=clamp(g + p.chGrn * (1 - g/255) * 1.0); }
    d[i]=clamp(r);d[i+1]=clamp(g);d[i+2]=clamp(b);
  }
  ctx.putImageData(img,0,0);

  if(p.vig){
    const alpha=Math.abs(p.vig)/100;
    const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.28,W/2,H/2,Math.max(W,H)*.76);
    v.addColorStop(0,'rgba(0,0,0,0)');
    v.addColorStop(1,p.vig<0?`rgba(0,0,0,${alpha})`:`rgba(255,255,255,${alpha})`);
    ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  }

  if(!skipGrain && p.grain>0){
    const gd=ctx.getImageData(0,0,W,H),dd=gd.data;
    const amt=p.grain*1.1;
    for(let i=0;i<dd.length;i+=4){
      const n=(Math.random()-.5)*amt;
      dd[i]=clamp(dd[i]+n);dd[i+1]=clamp(dd[i+1]+n);dd[i+2]=clamp(dd[i+2]+n);
    }
    ctx.putImageData(gd,0,0);
  }
}

// ════════════════════════════════════════
// LIVE FILTER PREVIEW
// Renders at 25% res, every 3rd frame (~10fps)
// — smooth enough to judge colour, cheap enough to stay fast
// ════════════════════════════════════════
function startLivePreview(){
  cancelAnimationFrame(liveRAF);
  const video  = document.getElementById('video');
  const canvas = document.getElementById('liveCanvas');
  const ctx    = canvas.getContext('2d',{willReadFrequently:true});

  function tick(){
    liveRAF = requestAnimationFrame(tick);

    // Skip 2 out of 3 frames → ~10fps render
    liveSkip = (liveSkip+1) % 3;
    if(liveSkip !== 0) return;

    if(video.readyState < 2){ return; }

    const p = getActiveParams();
    if(!p){
      canvas.style.display='none';
      return;
    }

    // Render at 1/4 native res for speed
    const W = Math.round(video.videoWidth  * 0.25) || 320;
    const H = Math.round(video.videoHeight * 0.25) || 180;

    if(canvas.width!==W || canvas.height!==H){
      canvas.width=W; canvas.height=H;
    }

    ctx.drawImage(video,0,0,W,H);
    // Merge EV compensation + manual exposure delta into filter params
    const manualDelta = computeManualEVDelta();
    const totalExAdj  = evCompensation*20 + (-manualDelta*20);
    const pWithEV = p ? Object.assign({}, p, {ex: (p.ex||0) + totalExAdj}) : null;
    applyFilter(ctx,W,H,pWithEV,true); // skipGrain=true for live preview
    canvas.style.display='block';
  }

  liveRAF = requestAnimationFrame(tick);
}

// ════════════════════════════════════════
// FILTER STRIP
// ════════════════════════════════════════
function buildStrip(){
  const strip = document.getElementById('fstrip');
  strip.innerHTML='';

  if(tab==='off'){ activeFilter='off'; stopLivePreview(); return; }

  const list = tab==='color' ? COLOR_FILTERS : MONO_FILTERS;

  // Snapshot video at thumbnail size
  const video=document.getElementById('video');
  const TW=52,TH=52;
  let snapData=null;
  if(video.readyState>=2){
    const tc=document.createElement('canvas');
    tc.width=TW; tc.height=TH;
    const tctx=tc.getContext('2d');
    tctx.drawImage(video,0,0,TW,TH);
    snapData=tctx.getImageData(0,0,TW,TH);
  }

  list.forEach(f=>{
    const chip=document.createElement('div');
    chip.className='fchip'+(f.id===activeFilter?' active':'');
    chip.dataset.id=f.id;

    const thumb=document.createElement('div');
    thumb.className='fthumb';

    const c=document.createElement('canvas');
    c.width=TW; c.height=TH;
    const cctx=c.getContext('2d');
    if(snapData){
      const clone=new ImageData(new Uint8ClampedArray(snapData.data),TW,TH);
      cctx.putImageData(clone,0,0);
      applyFilter(cctx,TW,TH,f.p,true); // no grain in thumbs
    } else {
      cctx.fillStyle='#222'; cctx.fillRect(0,0,TW,TH);
    }

    const img=document.createElement('img');
    img.src=c.toDataURL('image/jpeg',0.75);

    const fn=document.createElement('div');
    fn.className='fname';
    fn.textContent=f.name;

    thumb.appendChild(img);
    chip.appendChild(thumb);
    chip.appendChild(fn);
    chip.addEventListener('click',()=>selectFilter(f.id));
    strip.appendChild(chip);
  });
}

function selectFilter(id){
  activeFilter=id;
  document.querySelectorAll('.fchip').forEach(c=>c.classList.toggle('active',c.dataset.id===id));
}

function switchTab(t){
  tab=t;
  document.querySelectorAll('.ftab').forEach(b=>{
    const label=b.textContent.toLowerCase();
    b.classList.toggle('active',
      (t==='color'&&label==='color')||
      (t==='mono' &&label==='mono') ||
      (t==='off'  &&label==='off')
    );
  });
  activeFilter = t==='color'?'classic': t==='mono'?'m_leica':'off';
  buildStrip();
}

function stopLivePreview(){
  cancelAnimationFrame(liveRAF);
  document.getElementById('liveCanvas').style.display='none';
}

// ════════════════════════════════════════
// CAMERA
// ════════════════════════════════════════
async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:facing, width:{ideal:1920}, height:{ideal:1080} },
      audio:false
    });
    const v=document.getElementById('video');
    v.srcObject=stream; await v.play();
  }catch(e){ toast('Camera access denied'); }
}

async function flipCam(){
  facing=facing==='environment'?'user':'environment';
  evCompensation=0;
  document.getElementById('evSlider').value=0;
  document.getElementById('evReadout').textContent='0.0';
  hideAfCluster();
  await startCamera();
  setTimeout(buildStrip,600);
}

function setMode(m){
  mode=m;

document.getElementById('viewfinder').addEventListener('click', async e=>{
  if(e.target.closest('.bottom-ctrl,.top-hud,.mode-pills,#manualPanel,#afCluster')) return;

  const vf   = document.getElementById('viewfinder');
  const rect = vf.getBoundingClientRect();
  const x    = e.clientX - rect.left;
  const y    = e.clientY - rect.top;

  // Position the cluster
  const cluster = document.getElementById('afCluster');
  cluster.style.left    = x + 'px';
  cluster.style.top     = y + 'px';
  cluster.style.display = 'block';

  // AF snap animation

  void box.offsetWidth;
  box.classList.add('snap');

  // Show EV slider
  const evWrap = document.getElementById('evSliderWrap');
  evWrap.classList.add('show');

  // Try hardware focus point
  if(stream){
    const track = stream.getVideoTracks()[0];
    if(track && track.getCapabilities){
      const caps = track.getCapabilities();
      if(caps.focusPointsOfInterest){
        track.applyConstraints({advanced:[{
          focusMode:'single-shot',
          focusPointsOfInterest:[{x: x/rect.width, y: y/rect.height}]
        }]}).catch(()=>{});
      }
    }
  }

  clearTimeout(afTimer);
  afTimer = setTimeout(()=>{
    box.classList.add('focused');
  }, 320);

  // Auto-hide after 5 s of inactivity
  resetAfHideTimer();
});

function resetAfHideTimer(){
  clearTimeout(afHideTimer);
  afHideTimer = setTimeout(hideAfCluster, 5000);
}

function hideAfCluster(){
  const cluster = document.getElementById('afCluster');
  cluster.style.display = 'none';

function onEvSlider(val){
  evCompensation = parseFloat(val);
  const readout  = document.getElementById('evReadout');
  readout.textContent = (evCompensation >= 0 ? '+' : '') + evCompensation.toFixed(1);

  // Apply via hardware exposureCompensation where supported
  if(stream){
    const track = stream.getVideoTracks()[0];
    if(track && track.getCapabilities){
      const caps = track.getCapabilities();
      if(caps.exposureCompensation){
        const min = caps.exposureCompensation.min;
        const max = caps.exposureCompensation.max;
        const clamped = Math.max(min, Math.min(max, evCompensation));
        track.applyConstraints({advanced:[{exposureCompensation: clamped}]}).catch(()=>{});
      }
    }
  }
  // Reset hide timer whenever user interacts with slider
  resetAfHideTimer();
}

let pinchStart=null, pinchZoom=1;
document.getElementById('viewfinder').addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    pinchZoom=zoomLvl;
  }
},{passive:true});

document.getElementById('viewfinder').addEventListener('touchmove',async e=>{
  if(e.touches.length!==2||!pinchStart) return;
  const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  zoomLvl=Math.max(1,Math.min(6,pinchZoom*dist/pinchStart));
  if(stream){
    const track=stream.getVideoTracks()[0];
    if(track&&track.getCapabilities){
      const caps=track.getCapabilities();
      if(caps.zoom) track.applyConstraints({advanced:[{zoom:Math.max(caps.zoom.min,Math.min(caps.zoom.max,zoomLvl))}]}).catch(()=>{});
    }
  }
  const badge=document.getElementById('zoomBadge');
  badge.textContent=zoomLvl.toFixed(1)+'×';
  badge.classList.add('show');
  clearTimeout(zoomTimer);
  zoomTimer=setTimeout(()=>badge.classList.remove('show'),1400);
},{passive:true});

document.getElementById('viewfinder').addEventListener('touchend',()=>{ pinchStart=null; },{passive:true});

// ════════════════════════════════════════
// MANUAL EXPOSURE SIMULATION
// Computes an EV delta vs a reference "correct" exposure
// and applies it as brightness shift + ISO noise to the image
// ════════════════════════════════════════
function computeManualEVDelta(){
  if(mode !== 'manual') return 0;

  // Reference: f/2.0, 1/125, ISO 400 = EV ~10 in daylight
  const REF_F = 2.0, REF_T = 1/125, REF_ISO = 400;

  const f   = parseFloat(F_STOPS[fIdx]);
  const tStr= SHUTTERS[sIdx];
  const parts = tStr.replace('"','').split('/');
  const t   = parts.length>1 ? parseInt(parts[0])/parseInt(parts[1]) : parseFloat(parts[0]);
  const iso = parseInt(ISO_VALS[isoIdx]);

  // EV = log2(N²/t) - log2(ISO/100)  (camera EV formula)
  const evShot = Math.log2((f*f)/t) - Math.log2(iso/100);
  const evRef  = Math.log2((REF_F*REF_F)/REF_T) - Math.log2(REF_ISO/100);

  return evRef - evShot;  // positive = underexposed vs ref, negative = overexposed
}

function applyManualExposureToCanvas(ctx, W, H){
  if(mode !== 'manual') return;
  const delta = computeManualEVDelta();
  if(Math.abs(delta) < 0.1) return;

  const iso = parseInt(ISO_VALS[isoIdx]);

  const img = ctx.getImageData(0,0,W,H);
  const d   = img.data;

  // Exposure: multiply by 2^delta
  const expMult = Math.pow(2, -delta);  // negative delta = brighter

  // ISO noise: simulate sensor noise — increases with ISO
  const noiseFactor = Math.max(0, (iso - 400) / 400) * 18;

  // Motion blur sim for slow shutter: >1/60 adds slight softness (via grain)
  const tStr = SHUTTERS[sIdx].replace('"','');
  const parts = tStr.split('/');
  const t = parts.length>1 ? parseInt(parts[0])/parseInt(parts[1]) : parseFloat(parts[0]);
  const motionBlur = t > (1/60) ? Math.min((t - 1/60) * 120, 30) : 0;

  for(let i=0; i<d.length; i+=4){
    // Exposure adjustment
    let r = clamp(d[i]   * expMult);
    let g = clamp(d[i+1] * expMult);
    let b = clamp(d[i+2] * expMult);

    // ISO noise
    if(noiseFactor > 0){
      const n = (Math.random()-0.5) * noiseFactor;
      r = clamp(r+n); g = clamp(g+n); b = clamp(b+n);
    }

    // Motion blur grain (slow shutter)
    if(motionBlur > 0){
      const m = (Math.random()-0.5) * motionBlur;
      r=clamp(r+m); g=clamp(g+m); b=clamp(b+m);
    }

    d[i]=r; d[i+1]=g; d[i+2]=b;
  }
  ctx.putImageData(img,0,0);
}

// ════════════════════════════════════════
// AI ENHANCEMENT ENGINE
// Sends a downscaled JPEG to Claude Vision,
// receives scene-specific adjustment JSON,
// applies it to the full-res canvas.
// ════════════════════════════════════════
let aiEnabled = true;

document.getElementById('aiToggle').addEventListener('change', function(){
  aiEnabled = this.checked;
  document.getElementById('aiLabel').textContent = aiEnabled ? 'ON' : 'OFF';
  document.getElementById('aiLabel').style.color = aiEnabled ? 'var(--red)' : 'var(--silver)';
});

function setAiStatus(msg){ document.getElementById('aiStatus').innerHTML = msg; }
function showAiOverlay(){ document.getElementById('aiOverlay').style.display='flex'; }
function hideAiOverlay(){ document.getElementById('aiOverlay').style.display='none'; }

async function runAIEnhancement(canvas, ctx){
  showAiOverlay();
  setAiStatus('Analysing scene...');
  try{
    // Downscale to 512px wide for Vision analysis
    const thumb = document.createElement('canvas');
    const scale = Math.min(1, 512/canvas.width);
    thumb.width  = Math.round(canvas.width*scale);
    thumb.height = Math.round(canvas.height*scale);
    const tctx = thumb.getContext('2d');
    tctx.drawImage(canvas, 0, 0, thumb.width, thumb.height);
    const b64 = thumb.toDataURL('image/jpeg', 0.82).split(',')[1];

    setAiStatus('Reading light, colour & scene...');

    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:800,
        messages:[{
          role:'user',
          content:[
            { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:b64 }},
            { type:'text', text:`You are a professional photo retoucher with expertise in computational photography like Apple ProRAW and Samsung Expert RAW. Analyse this photo and return ONLY a valid JSON object (no markdown, no explanation) with pixel-level enhancement values.

Inspect carefully: sky colour/saturation, highlights, shadows, skin tones if present, overall white balance, and scene type.

Return exactly this JSON structure with integer values in the specified ranges:
{"scene":"daylight|golden_hour|overcast|indoor|night|sunset|backlit","skyBoost":0,"skyHueShift":0,"highlightRecovery":0,"shadowLift":0,"clarityBoost":0,"warmth":0,"tint":0,"saturation":0,"vibrance":0,"greeneryBoost":0,"skinProtect":false,"dehazeStrength":0,"contrastMicro":0,"noiseReduceStrength":0}

Ranges:
- skyBoost 0-60: boost blue in sky regions. 0=no sky, 40=sky needs major boost
- skyHueShift -20 to +20: shift sky hue (negative=cyan, positive=purple)
- highlightRecovery 0-50: recover blown highlights
- shadowLift 0-40: brighten deep shadows
- clarityBoost 0-30: local midtone contrast
- warmth -40 to +40: temperature (negative=cooler, positive=warmer)
- tint -20 to +20: green-magenta correction
- saturation -20 to +25: global saturation
- vibrance 0-30: boost muted colours
- greeneryBoost 0-40: enrich foliage greens
- skinProtect true/false: faces visible → protect skin from oversaturation
- dehazeStrength 0-40: remove haze/fog
- contrastMicro 0-20: fine detail contrast
- noiseReduceStrength 0-30: smooth noise (higher for dark/indoor)`
            }
          ]
        }]
      })
    });

    if(!resp.ok) throw new Error('API '+resp.status);
    const data = await resp.json();
    const raw  = data.content.find(b=>b.type==='text')?.text||'{}';
    const adj  = JSON.parse(raw.replace(/```json|```/g,'').trim());

    setAiStatus(`Scene: ${(adj.scene||'').replace('_',' ').toUpperCase()}<br>Applying enhancements...`);
    applyAIAdjustments(ctx, canvas.width, canvas.height, adj);
    setAiStatus('Done ✓');
    await new Promise(r=>setTimeout(r,400));
  } catch(e){
    console.warn('AI enhancement failed:',e);
    setAiStatus('Enhancement skipped');
    await new Promise(r=>setTimeout(r,600));
  } finally {
    hideAiOverlay();
  }
}

function applyAIAdjustments(ctx, W, H, adj){
  const img=ctx.getImageData(0,0,W,H), d=img.data;

  const skyBoost  = adj.skyBoost    ||0;
  const skyHue    = adj.skyHueShift ||0;
  const hlRec     = (adj.highlightRecovery||0)/100;
  const shLift    = (adj.shadowLift  ||0)/200;
  const warmth    = (adj.warmth      ||0)/100*20;
  const tint      = (adj.tint        ||0)/100*10;
  const satAdj    = 1+(adj.saturation||0)/100;
  const vibAdj    = (adj.vibrance    ||0)/200;
  const grnBoost  = (adj.greeneryBoost||0)/100*25;
  const dehaze    = (adj.dehazeStrength||0)/100;
  const microCo   = 1+(adj.contrastMicro||0)/100;
  const noiseF    = (adj.noiseReduceStrength||0)/255*0.35;
  const skinPro   = !!adj.skinProtect;

  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2];
    const lum=0.299*r+0.587*g+0.114*b;

    // Skin detection
    const isSkin = skinPro && r>100 && r>g && r>b && (r-g)>15 && (r-b)>20 && g>60 && b>40;

    // Highlight recovery
    if(hlRec>0 && lum>220){
      const f=(lum-220)/35*hlRec;
      r-=f*(r-200); g-=f*(g-200); b-=f*(b-200);
    }

    // Shadow lift
    if(shLift>0 && lum<80){
      const f=(80-lum)/80;
      r+=shLift*f*(255-r); g+=shLift*f*(255-g); b+=shLift*f*(255-b);
    }

    // Sky boost — detect blue-dominant regions
    const isSky = b>r && b>g && b>80 && (b-r)>20 && lum>80 && lum<230;
    if(isSky && skyBoost>0){
      const s=Math.min(1,(b-Math.max(r,g))/60)*skyBoost/100;
      b=clamp(b+s*(255-b)*0.7);
      r=clamp(r-s*8);
      if(skyHue<0) g=clamp(g-Math.abs(skyHue)*s*0.4);
      if(skyHue>0) r=clamp(r+skyHue*s*0.3);
    }

    // Greenery boost
    const isGrn = g>r && g>b && (g-r)>15 && (g-b)>10 && lum<200;
    if(isGrn && grnBoost>0){
      const s=Math.min(1,(g-Math.max(r,b))/50)*grnBoost/100;
      g=clamp(g+s*(255-g)*0.5); b=clamp(b-s*5);
    }

    // Warmth & tint
    r=clamp(r+warmth); b=clamp(b-warmth*0.7); g=clamp(g+tint);

    // Dehaze
    if(dehaze>0){
      const df=dehaze*0.5;
      r=clamp((r-128)*(1+df)+128);
      g=clamp((g-128)*(1+df)+128);
      b=clamp((b-128)*(1+df)+128);
    }

    // Micro contrast
    if(microCo!==1){
      const mid=(r+g+b)/3;
      r=clamp((r-mid)*microCo+mid);
      g=clamp((g-mid)*microCo+mid);
      b=clamp((b-mid)*microCo+mid);
    }

    // Saturation
    if(!isSkin){
      const avg=(r+g+b)/3;
      r=clamp(avg+(r-avg)*satAdj);
      g=clamp(avg+(g-avg)*satAdj);
      b=clamp(avg+(b-avg)*satAdj);
    }

    // Vibrance — boost muted colours
    if(vibAdj>0 && !isSkin){
      const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
      const sat2=mx?(mx-mn)/mx:0;
      const vb=1+vibAdj*(1-sat2);
      const avg2=(r+g+b)/3;
      r=clamp(avg2+(r-avg2)*vb);
      g=clamp(avg2+(g-avg2)*vb);
      b=clamp(avg2+(b-avg2)*vb);
    }

    // Noise reduction
    if(noiseF>0 && i>4 && i<d.length-4){
      r=clamp(r*(1-noiseF)+((d[i-4]+d[i+4])/2)*noiseF);
      g=clamp(g*(1-noiseF)+((d[i-3]+d[i+5])/2)*noiseF);
      b=clamp(b*(1-noiseF)+((d[i-2]+d[i+6])/2)*noiseF);
    }

    d[i]=clamp(r); d[i+1]=clamp(g); d[i+2]=clamp(b);
  }
  ctx.putImageData(img,0,0);
}

async function capture(){
  if(isCapturing||!stream) return;
  isCapturing=true;

  const video  = document.getElementById('video');
  const canvas = document.getElementById('captureCanvas');
  const ctx    = canvas.getContext('2d');

  // Crop to 4:5 matching viewfinder
  const vw = video.videoWidth  || 1920;
  const vh = video.videoHeight || 1080;
  const ratio45 = 4/5;
  let cW, cH, sx=0, sy=0;
  if(vw/vh > ratio45){
    cH=vh; cW=Math.round(vh*ratio45); sx=Math.round((vw-cW)/2);
  } else {
    cW=vw; cH=Math.round(vw/ratio45); sy=Math.round((vh-cH)/2);
  }
  canvas.width=cW; canvas.height=cH;
  ctx.drawImage(video, sx, sy, cW, cH, 0, 0, cW, cH);

  const btn=document.getElementById('shutterBtn');
  btn.classList.add('fire');
  setTimeout(()=>btn.classList.remove('fire'),450);

  const fl=document.getElementById('flash');
  fl.classList.add('pop');
  setTimeout(()=>fl.classList.remove('pop'),110);

  // 1. Apply manual exposure simulation (brightness + ISO noise + motion)
  applyManualExposureToCanvas(ctx, cW, cH);

  // 2. Apply colour filter + EV compensation
  const p=getActiveParams();
  const pWithEV = p ? Object.assign({}, p, {ex: (p.ex||0) + evCompensation*20}) : null;
  if(pWithEV) applyFilter(ctx, cW, cH, pWithEV, false);

  // 3. AI Enhancement — analyse scene and apply intelligent adjustments
  if(aiEnabled){
    await runAIEnhancement(canvas, ctx);
  }

  // JPEG quality 0.92 after AI processing
  const dataURL=canvas.toDataURL('image/jpeg',0.92);
  const meta={
    id:Date.now(), filter:activeFilter, mode,
    aiEnhanced: aiEnabled,
    f:mode==='manual'?'f/'+F_STOPS[fIdx]:'AUTO',
    s:mode==='manual'?SHUTTERS[sIdx]:'AUTO',
    iso:mode==='manual'?'ISO '+ISO_VALS[isoIdx]:'AUTO',
    ts:new Date().toISOString(), dataURL
  };
  photos.unshift(meta);
  try{ await dbSave(meta); } catch(e){ console.warn('DB save failed',e); }
  updateGalThumb(dataURL);
  toast(aiEnabled ? '✦ Frame enhanced & saved' : 'Frame saved');
  isCapturing=false;
}

  document.getElementById('galThumb').innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;">`;
}

function renderGallery(){
  const grid=document.getElementById('galGrid');

  document.getElementById('galCount').textContent=photos.length+(photos.length===1?' frame':' frames');
  if(!photos.length){ empty.style.display='flex'; grid.style.display='none'; return; }
  empty.style.display='none'; grid.style.display='grid';
  grid.innerHTML='';
  photos.forEach((p,idx)=>{
    const item=document.createElement('div');

    img.src=p.dataURL; img.loading='lazy';
    const badge=document.createElement('div');

    badge.textContent=p.filter.replace('m_','').substring(0,8);

      const aiBadge=document.createElement('div');

      aiBadge.textContent='AI';
      item.appendChild(aiBadge);
    }

    // Tap = open viewer
    item.addEventListener('click',()=>openViewer(idx));

    grid.appendChild(item);
  });

// VIEWER — swipeable carousel
// ════════════════════════════════════════
function buildViewerTrack(){
  const track = document.getElementById('viewerTrack');
  track.innerHTML = '';
  photos.forEach(p => {
    const slide = document.createElement('div');
    slide.className = 'v-slide';
    const img = document.createElement('img');
    img.src = p.dataURL;
    img.alt = p.filter;
    slide.appendChild(img);
    track.appendChild(slide);
  });
}

function updateViewerUI(){
  const p = photos[viewerIdx];
  if(!p) return;
  document.getElementById('viewerCounter').textContent =
    `${viewerIdx+1} / ${photos.length}`;
  document.getElementById('viewerMeta').innerHTML =
    `${p.filter.toUpperCase()} &nbsp;·&nbsp; ${p.f} &nbsp;·&nbsp; ${p.s} &nbsp;·&nbsp; ${p.iso}`+
    (p.aiEnhanced ? ' &nbsp;·&nbsp; <span style="color:var(--red);">✦ AI</span>' : '')+
    `<br><span style="font-size:8px;opacity:.5;">${new Date(p.ts).toLocaleString()}</span>`;
  // Move track without animation when opening, with animation when swiping
  const track = document.getElementById('viewerTrack');
  track.style.transform = `translateX(${-viewerIdx * 100}vw)`;
}

function openViewer(idx){
  viewerIdx = idx;
  buildViewerTrack();
  document.getElementById('viewer').classList.add('open');
  // Snap into position (no animation on open)
  const track = document.getElementById('viewerTrack');
  track.style.transition = 'none';
  track.style.transform  = `translateX(${-idx * 100}vw)`;
  requestAnimationFrame(()=>{
    track.style.transition = '';
    updateViewerUI();
  });
  initViewerSwipe();
}

function closeViewer(){
  document.getElementById('viewer').classList.remove('open');
}

function viewerStep(dir){
  const next = viewerIdx + dir;
  if(next < 0 || next >= photos.length) return;
  viewerIdx = next;
  updateViewerUI();
}

async function deleteCurrentPhoto(){
  if(viewerIdx < 0 || !photos[viewerIdx]) return;
  const p = photos[viewerIdx];
  if(!confirm('Delete this photo?')) return;

  try{ await dbDelete(p.id); } catch(e){ console.warn(e); }
  photos.splice(viewerIdx, 1);

  if(!photos.length){
    closeViewer();
    renderGallery();
    return;
  }
  // Stay on same index (now shows next photo), or step back if at end
  if(viewerIdx >= photos.length) viewerIdx = photos.length - 1;

  buildViewerTrack();
  const track = document.getElementById('viewerTrack');
  track.style.transition = 'none';
  track.style.transform  = `translateX(${-viewerIdx * 100}vw)`;
  requestAnimationFrame(()=>{ track.style.transition=''; updateViewerUI(); });
  renderGallery(); // refresh grid in background
}

function savePhoto(){
  if(viewerIdx < 0 || !photos[viewerIdx]) return;
  const a = document.createElement('a');
  a.href     = photos[viewerIdx].dataURL;
  a.download = `leitz-${photos[viewerIdx].id}.jpg`;
  a.click();
  toast('Saved to device');
}

// ── Touch swipe for viewer ──
function initViewerSwipe(){
  const viewer = document.getElementById('viewer');
  // Remove old listeners by cloning
  const fresh = viewer.cloneNode(true);
  viewer.parentNode.replaceChild(fresh, viewer);
  // Re-attach button handlers lost after clone
  fresh.querySelector('.v-close').onclick  = closeViewer;
  fresh.querySelector('.v-delete').onclick = deleteCurrentPhoto;
  fresh.querySelector('.v-save').onclick   = savePhoto;
  const arrows = fresh.querySelectorAll('.v-arrow');
  arrows[0].onclick = ()=>viewerStep(-1);
  arrows[1].onclick = ()=>viewerStep(1);

  let startX=0, startY=0, isDragging=false, moved=false;

  fresh.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    isDragging = true; moved = false;
  }, {passive:true});

  fresh.addEventListener('touchmove', e=>{
    if(!isDragging || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if(!moved && Math.abs(dy) > Math.abs(dx)) { isDragging=false; return; }
    moved = true;
    // Live drag feedback
    const track = fresh.querySelector('#viewerTrack');
    if(track){
      track.style.transition = 'none';
      track.style.transform  = `translateX(calc(${-viewerIdx * 100}vw + ${dx}px))`;
    }
  }, {passive:true});

  fresh.addEventListener('touchend', e=>{
    if(!isDragging) return;
    isDragging = false;
    const dx = e.changedTouches[0].clientX - startX;
    const track = fresh.querySelector('#viewerTrack');
    if(track) track.style.transition = '';
    if(Math.abs(dx) > 50){
      viewerStep(dx < 0 ? 1 : -1);
    } else {
      // Snap back
      if(track) track.style.transform = `translateX(${-viewerIdx * 100}vw)`;
    }
  }, {passive:true});
}

// ════════════════════════════════════════
// TOAST
// ════════════════════════════════════════
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1700);
}

// ════════════════════════════════════════
// BOOT
// ════════════════════════════════════════
if('serviceWorker' in navigator)
  navigator.serviceWorker.register('./sw.js').catch(()=>{});

if('wakeLock' in navigator){
  const lock=()=>navigator.wakeLock.request('screen').catch(()=>{});
  lock();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') lock(); });
}

// Allow horizontal scroll in filter strip, block everything else
document.getElementById('fstripWrap').addEventListener('touchmove', e=>e.stopPropagation(), {passive:true});
document.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});

window.addEventListener('load', async ()=>{
  updateDialDisplays();

  // Open IndexedDB first
  try{
    await openDB();
    photos = await dbLoadAll();
  } catch(e){
    console.warn('IndexedDB unavailable, falling back to memory',e);
    photos = [];
  }

  if(navigator.mediaDevices?.getUserMedia){
    await startCamera();
    const v=document.getElementById('video');
    const onReady=()=>{
      buildStrip();
      startLivePreview();
    };
    if(v.readyState>=2) onReady();
    else v.addEventListener('loadeddata', onReady, {once:true});
  } else {
    toast('Camera not available');
  }

  if(photos.length) updateGalThumb(photos[0].dataURL);
});
</script>
